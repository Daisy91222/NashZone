<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NashZone Workspace</title></head>
<body><header><strong>NashZone / Workspace</strong><a href="../">Nashville demo</a></header>
<main><section><h1>Project workspace</h1><div class="tools"><button id="new">New study</button><label class="import">Import project<input id="import" type="file" accept=".json"></label><button id="save">Save locally</button><button id="export">Export project</button></div><p id="status" role="status">Ready</p></section>
<div class="layout"><section><h2>Project data</h2><textarea id="editor" aria-label="Project JSON" spellcheck="false"></textarea><button id="apply">Apply project data</button><h2>Sources</h2><input id="source" type="file" accept=".txt,.md" aria-label="Import source text"><div id="sources"></div></section>
<section><h2>Rule review</h2><div id="rules"></div><h2>Scenarios</h2><label>Scenario<select id="scenario"></select></label><label>Minimum connected top plate<input id="area" type="number" min="1"></label><label>Floor height<input id="height" type="number" min="0.1" step="0.1"></label><button id="calculate">Calculate</button><p id="result">No calculation</p><svg id="plan" role="img" aria-label="Parcel and selected height plate"></svg><label>Height slice<input id="level" type="range" min="0" max="0" value="0"></label><p id="slice"></p><button id="report" disabled>Export review memo</button><h2>Review notes</h2><ul id="limits"></ul></section></div></main><script type="module" src="./main.mjs"></script></body></html>
